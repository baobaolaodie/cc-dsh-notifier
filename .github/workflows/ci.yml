name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: |
          node --check scripts/notify-agent.mjs
          node --check scripts/daemon.mjs
          node --check scripts/install.mjs
          node --check scripts/uninstall.mjs
          node --check scripts/test.mjs

      - name: Run tests
        run: npm test
