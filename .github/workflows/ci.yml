name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 测试: 跨 Node 版本 + 平台语法检查与单元测试 / Tests ──
  # windows-latest 使 win32 专属断言(大小写归一化/聚焦判定)真正执行;
  # ubuntu 矩阵保证跨平台兼容(本项目为 Windows 工具,ubuntu 是兼容性补充)
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        shell: bash
        run: |
          for f in $(git ls-files '*.mjs'); do
            node --check "$f" || { echo "语法错误 / syntax error: $f"; exit 1; }
          done

      - name: Run tests
        run: npm test

      # 覆盖率门禁:仅在 Node 22(最新)运行,避免矩阵重复
      - name: Coverage gate (Node 22 only)
        if: matrix.node-version == 22
        shell: bash
        run: |
          COV=$(node --test --experimental-test-coverage test/config.test.mjs test/dedup.test.mjs test/events.test.mjs test/focus.test.mjs test/window-title.test.mjs test/bind-window.test.mjs 2>&1)
          LINE=$(echo "$COV" | awk -F'|' '/all files/{gsub(/ /,"",$2); print $2}')
          BRANCH=$(echo "$COV" | awk -F'|' '/all files/{gsub(/ /,"",$3); print $3}')
          echo "line=${LINE}% branch=${BRANCH}%"
          # shellcheck disable=SC2016
          node -e '
            const line = parseFloat(process.argv[1]);
            const branch = parseFloat(process.argv[2]);
            if (line < 90) { console.error(`FAIL: line coverage ${line}% < 90%`); process.exit(1); }
            if (branch < 75) { console.error(`FAIL: branch coverage ${branch}% < 75%`); process.exit(1); }
            console.log("coverage gate PASS");
          ' "$LINE" "$BRANCH"

  # ── 质量: 双语镜像对称 + BOM 防线 / Quality ──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: '双语镜像对称 / Bilingual mirror symmetry'
        run: |
          python - <<'EOF'
          import io, os
          pairs = [('README.md','README-zh.md'),('CONTRIBUTING.md','CONTRIBUTING-zh.md'),
                   ('SECURITY.md','SECURITY-zh.md'),('CHANGELOG.md','CHANGELOG-zh.md'),
                   ('docs/INSTALLATION.md','docs/INSTALLATION-zh.md'),
                   ('docs/USAGE.md','docs/USAGE-zh.md'),
                   ('docs/TROUBLESHOOTING.md','docs/TROUBLESHOOTING-zh.md')]
          # CODE_OF_CONDUCT 除外:标准模板(Contributor Covenant)与官方翻译的段落行数天然不对齐
          for en, zh in pairs:
              if not os.path.isfile(en) or not os.path.isfile(zh):
                  raise SystemExit('missing bilingual pair: %s / %s' % (en, zh))
              ne = sum(1 for _ in io.open(en, encoding='utf-8'))
              nz = sum(1 for _ in io.open(zh, encoding='utf-8'))
              if abs(ne - nz) > 10:
                  raise SystemExit('bilingual asymmetry: %s %d vs %s %d' % (en, ne, zh, nz))
          print('7 bilingual pairs OK')
          EOF

      - name: 'BOM 防线 / BOM guard'
        run: |
          # 反向防线:win32.ps1 必须带 UTF-8 BOM(PS 5.1 解码中文注释依赖),
          # 其他文本文件禁止 BOM(防污染)
          if ! head -c 3 scripts/lib/win32.ps1 | od -An -tx1 | grep -qi 'ef bb bf'; then
            echo "win32.ps1 缺少 UTF-8 BOM(PS 5.1 必需)"; exit 1
          fi
          for f in $(git ls-files '*.mjs' '*.py' '*.md' '*.json' '*.yml' '*.yaml'); do
            if [ "$f" = "scripts/lib/win32.ps1" ]; then continue; fi
            if head -c 3 "$f" | od -An -tx1 | grep -qi 'ef bb bf'; then
              echo "非预期 BOM / unexpected BOM in: $f"; exit 1
            fi
          done

      - name: '版本一致性 / Version consistency'
        run: |
          # package.json version / README 版本徽章 / CHANGELOG 首个版本段 三者一致
          V1=$(node -p "require('./package.json').version")
          V2=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's/version-//')
          V3=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+' README-zh.md | head -1 | sed 's/version-//')
          V4=$(grep -m1 '^## \[' CHANGELOG.md | sed -E 's/## \[([0-9.]+).*/\1/')
          V5=$(grep -m1 '^## \[' CHANGELOG-zh.md | sed -E 's/## \[([0-9.]+).*/\1/')
          echo "package.json=$V1 README=$V2/$V3 CHANGELOG=$V4/$V5"
          if [ "$V1" = "$V2" ] && [ "$V1" = "$V3" ] && [ "$V1" = "$V4" ] && [ "$V1" = "$V5" ]; then
            :
          else
            echo "版本不一致 / version mismatch across docs"; exit 1
          fi

      - name: 'Workflow lint (actionlint)'
        uses: reviewdog/action-actionlint@v1

  # ── PR 纪律: 标题/模板/分支前缀(服务端强制)/ PR policy ──
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const P = [];

            // Branch prefix (feature branches carry a conventional prefix)
            if (!/^(feat|fix|docs|chore|hotfix|ci|test|release)\//.test(pr.head.ref))
              P.push(`PR head branch must carry a feat/fix/docs/chore/hotfix/ci/test prefix, got ${pr.head.ref}`);

            // PR template completeness: 4 bilingual sections + 17 checkboxes (deletion = fail)
            const tmpl = fs.readFileSync('.github/PULL_REQUEST_TEMPLATE.md', 'utf8');
            const body = pr.body ?? '';
            const SECTION_PAIRS = [
              ['## 摘要', '## Summary'],
              ['## 改动范围', '## Scope of Changes'],
              ['## 验证', '## Verification'],
              ['## 自查', '## Self-check'],
            ];
            for (const [zh, en] of SECTION_PAIRS)
              if (!body.includes(zh) && !body.includes(en))
                P.push(`PR body missing template section: ${zh} / ${en}`);
            for (const m of tmpl.matchAll(/^- \[ \] (.+)$/gm)) {
              const it = m[1].trim();
              if (!body.includes(`- [x] ${it}`) && !body.includes(`- [ ] ${it}`))
                P.push(`PR body deleted or omitted checkbox "${it.slice(0, 24)}…" (keep unchecked items)`);
            }

            // PR title must follow Conventional Commits
            const titleConv = /^(feat|fix|docs|chore|test|ci|refactor|perf|build|revert|release)(\([^)]+\))?: .+/;
            if (!titleConv.test(pr.title)) P.push(`PR title not Conventional Commits: "${pr.title}"`);

            // Commit messages must follow Conventional Commits
            const conv = /^(feat|fix|docs|chore|test|ci|refactor|perf|build|revert|release)(\([^)]+\))?: .+/;
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });
            for (const c of commits.data) {
              const msg = c.commit.message.split('\n')[0];
              if (/^Merge /.test(msg)) continue;
              if (!conv.test(msg)) P.push(`commit message not Conventional Commits: "${msg.slice(0, 60)}"`);
            }

            if (P.length) core.setFailed('Convention violations:\n' + P.join('\n'));

  # ── 死链 + 语言切换器 / Dead links ──
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: '死链检查 / Dead-link check'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md README-zh.md CONTRIBUTING.md CONTRIBUTING-zh.md SECURITY.md SECURITY-zh.md CODE_OF_CONDUCT.md CODE_OF_CONDUCT-zh.md CHANGELOG.md CHANGELOG-zh.md docs/INSTALLATION.md docs/INSTALLATION-zh.md docs/USAGE.md docs/USAGE-zh.md docs/TROUBLESHOOTING.md docs/TROUBLESHOOTING-zh.md .github/

  # ── 汇总门禁:分支保护 required check "CI" 的落点 ──
  # GitHub 不为此工作流产生名为 "CI" 的工作流级 check run(实测 check suite 仅 10 个 job 级),
  # 分支保护 required_checks=["CI"] 永远等待 → PR 卡 "CIExpected — Waiting for status to be reported"。
  # 本 job 产生同名 job 级 check run,全部检查通过后合并条件即满足。
  CI:
    needs: [test, quality, pr-policy, docs-links]
    # push 到 master 时 pr-policy 被跳过(if: pull_request),默认 success() 语义会让本 job 连带跳过;
    # !cancelled() && !failure():依赖成功或被跳过都运行,任一失败则跳过(保持门禁 fail-closed)
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "all CI checks passed"
