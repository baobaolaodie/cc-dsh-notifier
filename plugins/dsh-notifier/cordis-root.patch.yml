# 仓库根 bundle patch(git 安装/生态自动发现用):
# awesome-dsh-plugins 等雷达按「仓库根 package.json 的 dsh.bundle」识别插件;
# git 安装(dsh plugin add github:baobaolaodie/cc-dsh-notifier)时依赖名取根
# package.json 的 name = cc-dsh-notifier,所以插件行 name 必须是 cc-dsh-notifier
# (与依赖名精确一致,不靠 loader 容错;scoped 名 @baobaolaodie/cc-dsh-notifier
# 只用于子包 tarball/registry 安装,见 cordis.patch.yml)。
# loader 按包名从 node_modules 解析,入口取根 package.json 的 main
# (plugins/dsh-notifier/lib/index.js),运行时自包含(引用包内 ./runtime/)。
- insert:
    - id: dsh-notifier
      name: cc-dsh-notifier
